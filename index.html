<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#B76C72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Despedida en Río 💍 · Gastos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B76C72'/><text x='50' y='68' font-size='52' text-anchor='middle'>💍</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23B76C72'/><text x='50' y='68' font-size='52' text-anchor='middle'>💍</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" async onload="window.initSync&&initSync()"></script>
<style>
  :root{
    /* paleta: Vanilla Cream / Blush Petal / Rosewood / Sage Leaf / Misty Sky / Midnight Lagoon */
    --pink:#B76C72; --pink-dark:#8E4F57; --pink-soft:#F3DDE1; --pink-bg:#FAF7EE;
    --gold:#9AA170; --gold-soft:#E9E8D4; --ink:#2E3A47; --muted:#8B7F84;
    --green:#75845A; --red:#B44A55; --card:#ffffff; --radius:18px;
    --shadow:0 4px 16px rgba(46,58,71,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit} /* misma letra en TODO, también formularios */
  html,body{margin:0;padding:0}
  body{
    font-family:Tahoma,Verdana,"Segoe UI",-apple-system,sans-serif;
    background:var(--pink-bg); color:var(--ink);
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  header{
    background:linear-gradient(135deg,#D9A2AA 0%, var(--pink) 55%, #5F4148 100%);
    color:#fff; padding:calc(14px + env(safe-area-inset-top)) 18px 18px;
    border-radius:0 0 26px 26px; box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  header .deco{position:absolute; right:-6px; top:-14px; font-size:74px; opacity:.28; transform:rotate(12deg)}
  header .deco2{position:absolute; right:64px; bottom:-18px; font-size:52px; opacity:.22; transform:rotate(-10deg)}
  header h1{margin:0; font-size:22px; letter-spacing:.3px; display:flex; align-items:center; gap:8px}
  header .sub{font-size:12.5px; opacity:.9; margin-top:3px}
  .syncpill{display:inline-block; background:rgba(255,255,255,.25); border-radius:999px; padding:2px 10px; font-size:11px; font-weight:800; margin-left:4px; cursor:pointer}
  .egrid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
  .egrid span{font-size:26px; text-align:center; padding:8px 0; border-radius:12px; background:var(--pink-bg); cursor:pointer}
  .pemoji{font-size:22px; cursor:pointer; flex-shrink:0; background:var(--pink-bg); border-radius:10px; padding:3px 6px}
  main{padding:16px 14px 8px; max-width:560px; margin:0 auto}
  h2{font-size:15px; margin:18px 4px 10px; color:var(--pink-dark); text-transform:uppercase; letter-spacing:.6px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px}
  .row{display:flex; align-items:center; gap:10px}
  .grow{flex:1; min-width:0}
  .btn{
    border:none; border-radius:14px; padding:12px 16px; font-size:15px; font-weight:700;
    background:var(--pink); color:#fff; cursor:pointer; width:100%;
  }
  .btn:active{transform:scale(.98)}
  .btn.gold{background:linear-gradient(135deg,#B9BF8E,var(--gold)); color:#33381C}
  .btn.ghost{background:var(--pink-soft); color:var(--pink-dark)}
  .btn.small{width:auto; padding:8px 13px; font-size:13.5px; border-radius:11px}
  .btn.danger{background:#fde8e8; color:var(--red)}
  .fab{
    position:fixed; right:16px; bottom:calc(92px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#CB8891,var(--pink-dark)); color:#fff; font-size:30px; line-height:1;
    box-shadow:0 6px 20px rgba(142,79,87,.45); z-index:40; display:none;
  }
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#fff; border-top:1.5px solid var(--pink-soft);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; border:none; background:none; padding:9px 0 7px; cursor:pointer;
    color:var(--muted); font-size:11.5px; font-weight:600;
  }
  nav button .ico{display:block; font-size:22px; margin-bottom:2px; filter:grayscale(.9); opacity:.65}
  nav button.on{color:var(--pink)}
  nav button.on .ico{filter:none; opacity:1}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border-radius:999px;
    background:var(--pink-soft); color:var(--pink-dark); font-size:14px; font-weight:600;
    border:2px solid transparent; cursor:pointer; user-select:none;
  }
  .chip.on{background:var(--pink); color:#fff}
  .chip.goldOn{background:linear-gradient(135deg,#e3b64b,var(--gold)); color:#3d2a05}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  input[type=text],textarea,select{
    width:100%; border:2px solid var(--pink-soft); border-radius:13px; padding:11px 13px;
    font-size:16px; color:var(--ink); background:#fff; outline:none; font-family:inherit;
  }
  input:focus,textarea:focus{border-color:var(--pink)}
  label{font-size:12.5px; font-weight:700; color:var(--muted); display:block; margin:12px 2px 5px; text-transform:uppercase; letter-spacing:.5px}
  .seg{display:flex; background:var(--pink-soft); border-radius:13px; padding:4px; gap:4px}
  .seg button{
    flex:1; border:none; border-radius:10px; padding:9px 4px; font-size:14.5px; font-weight:700;
    background:none; color:var(--pink-dark); cursor:pointer;
  }
  .seg button.on{background:#fff; color:var(--pink); box-shadow:0 2px 6px rgba(0,0,0,.12)}
  /* expense list */
  .exp{display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:8px; cursor:pointer}
  .exp .emoji{font-size:26px; width:40px; height:40px; border-radius:12px; background:var(--pink-soft); display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .exp .t{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .exp .s{font-size:12.5px; color:var(--muted); margin-top:2px}
  .exp .amt{font-weight:800; font-size:15px; white-space:nowrap; text-align:right}
  .exp .cur{font-size:11px; color:var(--muted); text-align:right}
  .day{font-size:12px; font-weight:800; color:var(--muted); margin:14px 6px 7px; letter-spacing:.4px}
  /* balances */
  .bal{display:flex; align-items:center; gap:10px; padding:10px 2px}
  .bal .name{width:92px; font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bal .barwrap{flex:1; height:14px; border-radius:8px; background:#EFE9E0; overflow:hidden; display:flex}
  .bal .half{flex:1; position:relative}
  .bal .bar{position:absolute; top:0; bottom:0; border-radius:8px}
  .bal .num{width:98px; text-align:right; font-weight:800; font-size:13.5px; white-space:nowrap}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .transfer{display:flex; align-items:center; gap:8px; padding:11px 0; border-bottom:1px dashed var(--pink-soft); font-size:14.5px}
  .transfer:last-child{border-bottom:none}
  .transfer b{white-space:nowrap}
  .transfer .amt{margin-left:auto; font-weight:800; color:var(--pink-dark); white-space:nowrap}
  .note{font-size:13px; color:var(--muted); line-height:1.45; margin:8px 4px}
  .warn{background:#FBF7E4; border:1.5px solid #DDD8B4; color:#6A6336; border-radius:14px; padding:11px 13px; font-size:13.5px; line-height:1.4; margin-bottom:10px}
  .empty{text-align:center; padding:38px 20px; color:var(--muted)}
  .empty .big{font-size:52px; margin-bottom:10px}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(67,16,47,.55); z-index:60; display:none; align-items:flex-end; justify-content:center}
  .overlay.show{display:flex}
  .sheet{
    background:#fff; width:100%; max-width:560px; border-radius:24px 24px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto;
  }
  .sheet h3{margin:0 0 4px; font-size:18px; color:var(--pink-dark)}
  .handle{width:44px; height:5px; border-radius:3px; background:var(--pink-soft); margin:0 auto 12px}
  .catgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .cat{border:2px solid var(--pink-soft); border-radius:13px; padding:8px 2px; text-align:center; cursor:pointer; background:#fff}
  .cat .e{font-size:22px} .cat .l{font-size:10.5px; font-weight:700; color:var(--muted); margin-top:2px}
  .cat.on{border-color:var(--pink); background:var(--pink-soft)}
  .totrow{display:flex; justify-content:space-between; font-size:14px; padding:6px 2px}
  .totrow b{font-variant-numeric:tabular-nums}
  .pill{font-size:11px; background:var(--gold-soft); color:#6b4d00; border-radius:999px; padding:3px 9px; font-weight:800}
  .linklike{color:var(--pink); font-weight:700; text-decoration:underline; cursor:pointer}
  .partrow{display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px dashed var(--pink-soft)}
  .partrow:last-child{border-bottom:none}
  .partrow input{flex:1}
  .crown{font-size:22px; cursor:pointer; filter:grayscale(1); opacity:.35; flex-shrink:0}
  .crown.on{filter:none; opacity:1}
  .x{color:var(--red); font-weight:800; font-size:18px; cursor:pointer; padding:4px 8px; flex-shrink:0}
  .copybox{font-family:ui-monospace,monospace; font-size:11px; word-break:break-all; background:var(--pink-bg); border-radius:12px; padding:10px; max-height:110px; overflow:auto; color:var(--muted)}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(100px + env(safe-area-inset-bottom));
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600;
    z-index:99; opacity:0; transition:opacity .25s; pointer-events:none; max-width:86vw; text-align:center;
  }
  .toast.show{opacity:1}
  #bgLau{position:fixed; inset:0; z-index:-1; background-position:center 18%; background-size:cover; background-repeat:no-repeat; opacity:.09; pointer-events:none; display:none}
  .nv-foto{width:170px; height:170px; border-radius:50%; object-fit:cover; object-position:center 22%; border:5px solid rgba(255,255,255,.9); box-shadow:0 10px 34px rgba(0,0,0,.35); margin-bottom:12px}
  .albumband{
    display:flex; align-items:center; gap:9px; background:linear-gradient(135deg,#F2F1E2,var(--gold-soft));
    border:1.5px solid #D6D3AE; border-radius:14px; padding:11px 14px; margin-bottom:12px;
    color:#565A32; text-decoration:none; font-size:14px; box-shadow:var(--shadow);
  }
  .albumband b{flex:1}
  .albumband .arrow{font-size:18px; font-weight:800}
  /* plan / itinerario */
  .plan{display:flex; align-items:center; gap:11px; padding:11px 14px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:8px; cursor:pointer}
  .plan .chk{font-size:22px; flex-shrink:0}
  .plan .hora{font-size:12px; font-weight:800; color:var(--pink); background:var(--pink-soft); border-radius:8px; padding:3px 7px; flex-shrink:0}
  .plan .t{font-weight:700; font-size:15px}
  .plan .n{font-size:12.5px; color:var(--muted); margin-top:1px}
  .plan.done .t{text-decoration:line-through; opacity:.5}
  .plan.done .n{opacity:.5}
  .day.today{color:var(--pink); font-size:13px}
  /* página de la novia */
  .noviaPage{
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#D9A2AA 0%, var(--pink) 45%, var(--ink) 115%); color:#fff; text-align:center; padding:24px; overflow:hidden;
  }
  .noviaPage .nv-title{font-size:34px; font-weight:800; letter-spacing:1px; margin:6px 0}
  .noviaPage .nv-msg{font-size:17px; opacity:.95; font-weight:600}
  .noviaPage .nv-days{font-size:110px; font-weight:800; line-height:1; margin:8px 0; text-shadow:0 6px 24px rgba(0,0,0,.25)}
  .noviaPage .nv-clock{font-size:20px; font-weight:700; margin-top:14px; background:rgba(255,255,255,.18); border-radius:999px; padding:8px 20px; font-variant-numeric:tabular-nums}
  .noviaPage .nv-sub{font-size:14px; opacity:.85; margin-top:18px}
  .heart{position:absolute; bottom:-40px; font-size:26px; animation:floatUp linear infinite; opacity:.7}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(-8deg)}
    100%{transform:translateY(-110vh) rotate(10deg)}
  }
  .setupWrap{max-width:560px; margin:0 auto; padding:8px 16px}
  .bigTitle{font-size:26px; margin:18px 0 4px; color:var(--pink-dark)}
</style>
</head>
<body>

<div id="bgLau"></div>

<header>
  <div class="deco">🌴</div><div class="deco2">💍</div>
  <h1 id="hTitle">Despedida en Río 💍</h1>

<main id="main"></main>

<button class="fab" id="fab" onclick="view==='plan'?openPlanItem():openExpense()">＋</button>

<nav id="nav">

  <button data-v="saldos" onclick="go('saldos')"><span class="ico">💸</span>Saldos</button>
  <button data-v="ajustes" onclick="go('ajustes')"><span class="ico">⚙️</span>Ajustes</button>
</nav>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

/* ================= Utilidades ================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){
  const r=Math.round(n*100)/100;
  const dec=Number.isInteger(r)?0:2;
  return new Intl.NumberFormat('es-AR',{minimumFractionDigits:dec, maximumFractionDigits:dec}).format(r);
}
function money(n,cur){ return SYM[cur]+' '+fmt(n); }
function parseAmt(s){
  s=String(s||'').trim().replace(/\s/g,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/,/g,'');
  const n=parseFloat(s);
  return (isFinite(n)&&n>0)?n:null;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function liveParts(){ return state.parts.filter(p=>!p.del); }

function pName(id){ const p=state.parts.find(p=>p.id===id); return p?p.name:'—'; }
function pTag(id){ const p=state.parts.find(p=>p.id===id); return p?((p.e?p.e+' ':'')+esc(p.name)):'—'; }
function pTagRaw(id){ const p=state.parts.find(p=>p.id===id); return p?((p.e?p.e+' ':'')+p.name):'—'; }
function bride(){ return liveParts().find(p=>p.bride); }

/* conversión: base ARS */
function toARS(a,cur){
  if(cur==='ARS') return a;
  if(cur==='USD') return state.rates.usdArs? a*state.rates.usdArs : null;
  if(cur==='BRL') return state.rates.brlArs? a*state.rates.brlArs : null;
  return null;
}
function fromARS(v,cur){
  if(cur==='ARS') return v;
  if(cur==='USD') return state.rates.usdArs? v/state.rates.usdArs : null;
  if(cur==='BRL') return state.rates.brlArs? v/state.rates.brlArs : null;
  return null;
}
function conv(a,from,to){ if(from===to) return a; const ars=toARS(a,from); return ars==null?null:fromARS(ars,to); }
function curSet(){ return [...new Set(liveExps().map(e=>e.cur))]; }
function ratesReady(){
  const cs=curSet();
  const need=new Set(cs); need.add(dispCur);
  if(need.size<=1) return true;
  if(need.has('USD')&&!state.rates.usdArs) return false;
  if(need.has('BRL')&&!state.rates.brlArs) return false;
  return true;
}

/* ================= Cálculo de saldos ================= */
/* net por persona en moneda display; null si faltan tipos de cambio */
function netBalances(){
  const nets={}; liveParts().forEach(p=>nets[p.id]=0);
  for(const e of liveExps()){
    const amt=conv(e.amt,e.cur,dispCur);
    if(amt==null) return null;
    const split=e.split.filter(id=>nets[id]!==undefined);
    if(!split.length) continue;
    const share=amt/split.length;
    if(nets[e.payer]!==undefined) nets[e.payer]+=amt;
    split.forEach(id=>nets[id]-=share);
  }
  return nets;
}
/* transferencias mínimas (greedy) */
function settle(nets){
  const EPS=0.01;
  const deb=[],cre=[];
  for(const[id,v]of Object.entries(nets)){
    if(v<-EPS) deb.push({id,v:-v});
    else if(v>EPS) cre.push({id,v});
  }
  deb.sort((a,b)=>b.v-a.v); cre.sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<deb.length&&j<cre.length){
    const x=Math.min(deb[i].v,cre[j].v);
    out.push({from:deb[i].id,to:cre[j].id,amt:x});
    deb[i].v-=x; cre[j].v-=x;
    if(deb[i].v<EPS)i++;
    if(cre[j].v<EPS)j++;
  }
  return out;
}
function totalsByCur(){
  const t={};
  for(const e of liveExps()) t[e.cur]=(t[e.cur]||0)+e.amt;
  return t;
}

function render(){
  const m=document.getElementById('main');
  document.getElementById('fab').style.display = (liveParts().length&&(view==='gastos'||view==='plan'))?'block':'none';
  document.getElementById('hTitle').innerHTML=esc(state.title)+' 💍';
  if(!liveParts().length){ m.innerHTML=setupHTML(); document.getElementById('nav').style.display='none'; return; }
  document.getElementById('nav').style.display='flex';
  if(view==='gastos') m.innerHTML=gastosHTML();
  else if(view==='plan') m.innerHTML=planHTML();
  else if(view==='saldos') m.innerHTML=saldosHTML();
  else m.innerHTML=ajustesHTML();
}

function refreshSetup(){ const el=document.getElementById('setupList'); if(el) el.innerHTML=setupListHTML(); }
function addSetupName(){

function setupBride(i){ setupNames.forEach((p,j)=>p.bride=(j===i? !p.bride:false)); refreshSetup(); }
function finishSetup(){
  if(setupNames.length<2){ toast('Cargá al menos 2 personas'); return; }
  const t=now();
  state.parts=setupNames.map(p=>({id:uid(), name:p.name, bride:p.bride, up:t}));

function albumBand(){

function gastosHTML(){

  </div>`;
  const tot=totalsByCur();
  let html=albumBand();
  html+=`<div class="card"><div style="font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px">TOTAL DEL VIAJE</div>`;

  let lastDay='';
  for(const e of exps){

/* ---------- Vista Plan / Itinerario ---------- */
function livePlan(){ return (state.plan||[]).filter(i=>!i.del); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtPlanDay(ds){
  if(!ds) return 'Sin fecha todavía 🤷‍♀️';
  const d=new Date(ds+'T12:00:00');
  return d.toLocaleDateString('es-AR',{weekday:'long', day:'numeric', month:'short'}).toUpperCase();
}
function planHTML(){
  const items=livePlan().sort((a,b)=>((a.date||'9999')+(a.time||'99:99')).localeCompare((b.date||'9999')+(b.time||'99:99')));
  let html=albumBand();
  if(!items.length) return html+`<div class="empty">
    <div class="big">🗓️</div>
    <b>Todavía no hay plan</b>
    <p class="note">Tocá el <b>＋</b> y armen el itinerario entre todas:<br>playa, cena, la sorpresa para Lau 🤫... acá va todo, con día y hora.</p>
  </div>`;
  const hoy=todayStr();
  let lastDay='—';
  for(const it of items){
    if(it.date!==lastDay){
      const esHoy=it.date===hoy;
      html+=`<div class="day ${esHoy?'today':''}">${esHoy?'🌴 HOY · ':''}${fmtPlanDay(it.date)}</div>`;
      lastDay=it.date;
    }
    html+=`<div class="plan ${it.done?'done':''}">
      <span class="chk" onclick="event.stopPropagation();togglePlanDone('${it.id}')">${it.done?'✅':'⬜'}</span>
      <div class="grow" onclick="openPlanItem('${it.id}')">
        <div class="t">${esc(it.txt)}</div>
        ${it.note?`<div class="n">${esc(it.note)}</div>`:''}
      </div>
      ${it.time?`<span class="hora">${esc(it.time)}</span>`:''}
    </div>`;
  }
  return html;
}
let editingPlanId=null;
function openPlanItem(id){
  editingPlanId=id||null;
  const it=id? state.plan.find(x=>x.id===id):null;
  document.getElementById('sheet').innerHTML=`
    <div class="handle"></div>
    <h3>${it?'Editar plan ✏️':'Nuevo plan 🗓️'}</h3>
    <label>¿Qué hacemos?</label>
    <input type="text" id="plTxt" placeholder="Atardecer en Arpoador" value="${it?esc(it.txt):''}">
    <label>Día</label>
    <input type="date" id="plDate" value="${it?(it.date||''):''}">
    <label>Hora (opcional)</label>
    <input type="time" id="plTime" value="${it?(it.time||''):''}">
    <label>Nota (opcional)</label>
    <input type="text" id="plNote" placeholder="Llevar efectivo / reserva a nombre de..." value="${it&&it.note?esc(it.note):''}">
    <div style="height:16px"></div>
    <button class="btn" onclick="savePlanItem()">${it?'Guardar cambios':'Agendar ✔'}</button>
    ${it?`<div style="height:8px"></div><button class="btn danger" onclick="deletePlanItem('${it.id}')">Eliminar 🗑</button>`:''}
  `;
  document.getElementById('overlay').classList.add('show');
  if(!it) setTimeout(()=>document.getElementById('plTxt').focus(),150);
}
function savePlanItem(){
  const txt=document.getElementById('plTxt').value.trim();
  if(!txt){toast('Contanos qué es el plan 😊');return;}
  const date=document.getElementById('plDate').value||'';
  const time=document.getElementById('plTime').value||'';
  const note=document.getElementById('plNote').value.trim();
  const t=now();
  if(!state.plan) state.plan=[];
  if(editingPlanId){
    const it=state.plan.find(x=>x.id===editingPlanId);
    Object.assign(it,{txt,date,time,note,up:t});
    markDirty('i_'+it.id);
  }else{
    const it={id:uid(),txt,date,time,note,done:false,up:t};
    state.plan.push(it); markDirty('i_'+it.id);
  }
  save(); closeSheet(); go('plan'); toast(editingPlanId?'Plan actualizado ✔':'¡Agendado! 🎉');
  editingPlanId=null;
}
function togglePlanDone(id){
  const it=state.plan.find(x=>x.id===id);
  if(it){ it.done=!it.done; it.up=now(); markDirty('i_'+it.id); save(); render(); }
}
function deletePlanItem(id){
  if(!confirm('¿Eliminar este plan?'))return;
  const it=state.plan.find(x=>x.id===id);
  if(it){it.del=1;it.up=now();markDirty('i_'+it.id);}
  save(); closeSheet(); render(); toast('Plan eliminado 🗑');
}

/* ---------- Vista Saldos ---------- */
function saldosHTML(){
  let html=`<div class="seg" style="margin-bottom:14px">`+
    CURS.map(c=>`<button class="${dispCur===c?'on':''}" onclick="dispCur='${c}';render()">${SYM[c]} ${CURNAME[c]}</button>`).join('')+`</div>`;
  if(!liveExps().length) return html+`<div class="empty"><div class="big">💅</div><b>Sin gastos, sin deudas</b><p class="note">Cuando carguen gastos, acá van a ver quién le debe a quién.</p></div>`;
  if(!ratesReady()){
    html+=`<div class="warn">⚠️ Para mezclar monedas falta cargar el tipo de cambio. Ponelo en <span class="linklike" onclick="go('ajustes')">Ajustes</span> y listo. Mientras tanto, abajo tenés los totales por moneda.</div>`;
    const tot=totalsByCur();
    html+=`<div class="card">`+Object.entries(tot).map(([c,v])=>`<div class="totrow"><span>Total en ${CURNAME[c].toLowerCase()}</span><b>${money(v,c)}</b></div>`).join('')+`</div>`;
    return html;
  }
  const nets=netBalances();
  const maxAbs=Math.max(...Object.values(nets).map(Math.abs),1);
  const totalARS=liveExps().reduce((s,e)=>s+toARS(e.amt,e.cur),0);
  const totalDisp=fromARS(totalARS,dispCur);
  html+=`<div class="card" style="text-align:center">
    <div style="font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px">GASTAMOS EN TOTAL</div>
    <div style="font-size:28px;font-weight:800;color:var(--pink-dark)">${money(totalDisp,dispCur)}</div>
    <div class="note" style="margin:2px 0 0">≈ ${money(totalDisp/liveParts().length,dispCur)} por persona ✨</div>
  </div>`;
  html+=`<h2>Cómo viene cada una</h2><div class="card">`;
  for(const p of liveParts()){
    const v=nets[p.id];
    const w=Math.min(100,Math.abs(v)/maxAbs*100);
    const posBar = v>0.01? `<span class="bar" style="left:0;width:${w}%;background:var(--green)"></span>`:'';
    const negBar = v<-0.01? `<span class="bar" style="right:0;width:${w}%;background:var(--red)"></span>`:'';
    html+=`<div class="bal">
      <div class="name">${p.bride?'👑':p.e||''} ${esc(p.name)}</div>
      <div class="barwrap"><span class="half">${negBar}</span><span class="half">${posBar}</span></div>
      <div class="num ${v>0.01?'pos':v<-0.01?'neg':''}">${v>0.01?'+':''}${money(v,dispCur)}</div>
    </div>`;
  }
  html+=`</div><p class="note">Verde = puso de más y le deben 💚 · Rojo = debe poner 💸</p>`;
  const ts=settle(nets);
  html+=`<h2>Quién le paga a quién</h2><div class="card">`;
  if(!ts.length) html+=`<p class="note" style="text-align:center;margin:4px">¡Están a mano! 🥂</p>`;
  else html+=ts.map(t=>`<div class="transfer"><b>${pTag(t.from)}</b> ➜ <b>${pTag(t.to)}</b><span class="amt">${money(t.amt,dispCur)}</span></div>`).join('');
  html+=`</div>`;
  html+=`<button class="btn gold" style="margin-top:10px" onclick="shareSummary()">Compartir resumen por WhatsApp 💬</button>`;
  return html;
}

function saveRates(){
  const u=parseAmt(document.getElementById('rUsd').value);
  const b=parseAmt(document.getElementById('rBrl').value);
  state.rates={usdArs:u||null, brlArs:b||null, up:now()};
  markDirty('meta_rates');
  save(); toast('Tipo de cambio guardado ✔'); render();
}
function toggleBride(id){
  const t=now();
  state.parts.forEach(p=>{ const nv=(p.id===id? !p.bride:false); if(nv!==p.bride){p.bride=nv;p.up=t;markDirty('p_'+p.id);} });
  save(); render();
}
function renamePart(id,name){
  name=name.trim(); if(!name){render();return;}
  const p=state.parts.find(p=>p.id===id);
  if(p){p.name=name;p.up=now();markDirty('p_'+p.id);save();render();}
}
function partEmoji(id){
  pickEmoji(em=>{
    const p=state.parts.find(p=>p.id===id);
    if(p){p.e=em;p.up=now();markDirty('p_'+p.id);save();render();}
  });
}
function addPart(){
  const inp=document.getElementById('addName');
  const n=inp.value.trim(); if(!n)return;
  if(liveParts().some(p=>p.name.toLowerCase()===n.toLowerCase())){toast('Ese nombre ya está 😅');return;}
  const used=new Set(liveParts().map(p=>p.e));
  const p={id:uid(),name:n,e:EMOJIS.find(e=>!used.has(e))||'✨',bride:false,up:now()};
  state.parts.push(p); markDirty('p_'+p.id);
  save(); render();
}
function removePart(id){
  const used=liveExps().some(e=>e.payer===id||e.split.includes(id));
  if(used){ toast('Tiene gastos asociados, no se puede sacar 😬'); return; }
  const p=state.parts.find(p=>p.id===id);
  if(p && confirm('¿Sacar a '+p.name+' del grupo?')){ p.del=1; p.up=now(); markDirty('p_'+p.id); save(); render(); }
}

function resetAll(){

/* ---------- Alta / edición de gasto ---------- */
let fCur='BRL', fCat='comida', fPayer=null, fSplit=null;
function openExpense(id){
  editingId=id||null;
  const e=id? state.exps.find(x=>x.id===id):null;
  fCur=e?e.cur:'BRL';
  fCat=e?e.cat:'comida';
  fPayer=e?e.payer:liveParts()[0].id;
  fSplit=e? new Set(e.split): new Set(liveParts().map(p=>p.id));
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=`
    <div class="handle"></div>
    <h3>${e?'Editar gasto ✏️':'Nuevo gasto 🍹'}</h3>
    <label>¿Qué fue?</label>
    <input type="text" id="fDesc" placeholder="Caipirinhas en Ipanema" value="${e?esc(e.desc):''}">
    <label>Categoría</label>
    <div class="catgrid" id="fCats">${CATS.map(c=>`<div class="cat ${fCat===c.id?'on':''}" onclick="fCat='${c.id}';paintCats()"><div class="e">${c.e}</div><div class="l">${c.l}</div></div>`).join('')}</div>
    <label>¿Cuánto?</label>
    <input type="text" inputmode="decimal" id="fAmt" placeholder="0,00" value="${e?String(e.amt).replace('.',','):''}">
    <label>Moneda</label>
    <div class="seg" id="fCurs">${CURS.map(c=>`<button class="${fCur===c?'on':''}" onclick="fCur='${c}';paintCurs()">${SYM[c]} ${CURNAME[c]}</button>`).join('')}</div>
    <label>¿Quién pagó?</label>
    <div class="chips" id="fPayers">${liveParts().map(p=>`<span class="chip ${fPayer===p.id?'on':''}" onclick="fPayer='${p.id}';paintPayers()">${p.e?p.e+' ':''}${esc(p.name)}</span>`).join('')}</div>
    <label>¿Entre quiénes se divide?</label>
    <div class="row" style="margin-bottom:8px">
      <button class="btn small ghost" onclick="splitAll()">Todas</button>
      ${bride()?`<button class="btn small gold" onclick="splitNoBride()">Todas menos la novia 👑</button>`:''}
    </div>
    <div class="chips" id="fSplits">${splitChipsHTML()}</div>
    <div style="height:16px"></div>
    <button class="btn" onclick="saveExpense()">${e?'Guardar cambios':'Anotar gasto ✔'}</button>
    ${e?`<div style="height:8px"></div><button class="btn danger" onclick="deleteExpense('${e.id}')">Eliminar gasto 🗑</button>`:''}
  `;
  document.getElementById('overlay').classList.add('show');
  if(!e) setTimeout(()=>document.getElementById('fDesc').focus(),150);
}
function splitChipsHTML(){
  return liveParts().map(p=>`<span class="chip ${fSplit.has(p.id)?'on':''}" onclick="toggleSplit('${p.id}')">${p.e?p.e+' ':''}${esc(p.name)}</span>`).join('');
}
function paintCats(){ document.getElementById('fCats').querySelectorAll('.cat').forEach((el,i)=>el.classList.toggle('on',CATS[i].id===fCat)); }
function paintCurs(){ document.getElementById('fCurs').querySelectorAll('button').forEach((el,i)=>el.classList.toggle('on',CURS[i]===fCur)); }
function paintPayers(){ const ps=liveParts(); document.getElementById('fPayers').querySelectorAll('.chip').forEach((el,i)=>el.classList.toggle('on',ps[i].id===fPayer)); }
function paintSplits(){ document.getElementById('fSplits').innerHTML=splitChipsHTML(); }
function toggleSplit(id){ if(fSplit.has(id))fSplit.delete(id); else fSplit.add(id); paintSplits(); }
function splitAll(){ fSplit=new Set(liveParts().map(p=>p.id)); paintSplits(); }
function splitNoBride(){ const b=bride(); fSplit=new Set(liveParts().filter(p=>!b||p.id!==b.id).map(p=>p.id)); paintSplits(); }
function saveExpense(){
  const desc=document.getElementById('fDesc').value.trim();
  const amt=parseAmt(document.getElementById('fAmt').value);
  if(!desc){toast('Contanos qué fue el gasto 😊');return;}
  if(!amt){toast('El monto no parece válido 🤔');return;}
  if(!fSplit.size){toast('Elegí entre quiénes se divide');return;}
  const t=now();
  if(editingId){
    const e=state.exps.find(x=>x.id===editingId);
    Object.assign(e,{desc,amt,cur:fCur,cat:fCat,payer:fPayer,split:[...fSplit],up:t});
    markDirty('e_'+e.id);
  }else{
    const e={id:uid(),ts:t,up:t,desc,amt,cur:fCur,cat:fCat,payer:fPayer,split:[...fSplit]};
    state.exps.push(e); markDirty('e_'+e.id);
  }
  save(); closeSheet(); go('gastos'); toast(editingId?'Gasto actualizado ✔':'¡Anotado! 🎉');
  editingId=null;
}
function deleteExpense(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  const e=state.exps.find(x=>x.id===id);
  if(e){e.del=1;e.up=now();markDirty('e_'+e.id);}
  save(); closeSheet(); render(); toast('Gasto eliminado 🗑');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }

/* ---------- Sync ---------- */
function encodeData(){
  const payload={v:1, title:state.title, parts:state.parts, rates:state.rates, exps:state.exps, plan:state.plan||[]};
  return 'RIO1.'+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function decodeData(code){
  code=String(code||'').trim();
  const m=code.match(/RIO1\.[A-Za-z0-9+/=]+/);
  if(!m) return null;
  try{
    const json=decodeURIComponent(escape(atob(m[0].slice(5))));
    const d=JSON.parse(json);
    if(!d||d.v!==1||!Array.isArray(d.parts)||!Array.isArray(d.exps)) return null;
    return d;
  }catch(e){ return null; }
}
function brideDedupe(){
  if(state.parts.filter(p=>p.bride&&!p.del).length>1){
    let best=null; state.parts.forEach(p=>{ if(p.bride&&!p.del){ if(!best||(p.up||0)>(best.up||0)){ if(best)best.bride=false; best=p; } else p.bride=false; } });
  }
}
function mergeData(d){
  const byId=(arr)=>{const m={};arr.forEach(x=>m[x.id]=x);return m;};
  // participantes
  const pm=byId(state.parts);
  d.parts.forEach(p=>{ if(!pm[p.id]||((p.up||0)>(pm[p.id].up||0))) pm[p.id]=p; });
  state.parts=Object.values(pm);
  brideDedupe();
  // gastos
  const em=byId(state.exps);
  let added=0;
  d.exps.forEach(e=>{
    if(!em[e.id]){ em[e.id]=e; if(!e.del)added++; }
    else if((e.up||0)>(em[e.id].up||0)) em[e.id]=e;
  });
  state.exps=Object.values(em);
  // plan
  if(!state.plan) state.plan=[];
  const im=byId(state.plan);
  (d.plan||[]).forEach(i=>{
    if(!im[i.id]) im[i.id]=i;
    else if((i.up||0)>(im[i.id].up||0)) im[i.id]=i;
  });
  state.plan=Object.values(im);
  // tipo de cambio y título
  if(d.rates&&(d.rates.up||0)>(state.rates.up||0)) state.rates=d.rates;
  if(d.title&&(!state.title||state.title==='Despedida en Río')) state.title=d.title;
  save();
  return added;
}
function shareData(){
  const code=encodeData();
  const text='💍 Datos de gastos de la despedida — copiá este mensaje completo y pegalo en la app (Ajustes → Importar):\n\n'+code;
  if(navigator.share){ navigator.share({text}).catch(()=>{}); }
  else{
    copyText(text);
    window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  }
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('Copiado 📋')).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy');toast('Copiado 📋');}catch(e){} ta.remove();
}
function openImport(){
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=`
    <div class="handle"></div>
    <h3>Importar datos 📥</h3>
    <p class="note">Pegá acá el mensaje que te mandó tu amiga (el que empieza con <b>RIO1.</b> o el mensaje completo de WhatsApp). Los gastos se combinan, nada se pierde.</p>
    <textarea id="impBox" rows="5" placeholder="Pegá el código acá..."></textarea>
    <div style="height:12px"></div>
    <button class="btn" onclick="doImport()">Combinar datos ✔</button>`;
  document.getElementById('overlay').classList.add('show');
}
function doImport(){
  const d=decodeData(document.getElementById('impBox').value);
  if(!d){ toast('No pude leer el código 😕 Fijate que esté completo'); return; }
  const added=mergeData(d);
  markAllDirty();
  closeSheet(); go('gastos');
  toast(added?('¡Listo! '+added+' gasto'+(added>1?'s':'')+' nuevo'+(added>1?'s':'')+' 🎉'):'Datos combinados, ya estabas al día ✔');
}
function shareSummary(){
  if(!ratesReady()){ toast('Falta el tipo de cambio en Ajustes'); return; }
  const nets=netBalances(); const ts=settle(nets);
  const totARS=liveExps().reduce((s,e)=>s+toARS(e.amt,e.cur),0);
  let text='💍🌴 *'+state.title+'* — resumen de gastos\n\n';
  text+='Total: *'+money(fromARS(totARS,dispCur),dispCur)+'* ('+CURNAME[dispCur].toLowerCase()+')\n\n';
  text+='*Cómo viene cada una:*\n';
  for(const p of liveParts()){
    const v=nets[p.id];
    text+=(p.bride?'👑 ':(p.e?p.e+' ':''))+p.name+': '+(v>0.01?'le deben '+money(v,dispCur)+' 💚':v<-0.01?'debe '+money(-v,dispCur)+' 💸':'a mano 🥂')+'\n';
  }
  if(ts.length){
    text+='\n*Para quedar a mano:*\n';
    ts.forEach(t=>{ text+='• '+pTagRaw(t.from)+' ➜ '+pTagRaw(t.to)+': '+money(t.amt,dispCur)+'\n'; });
  } else text+='\n¡Estamos todas a mano! 🥂\n';
  text+='\n✨ App de la despedida';
  if(navigator.share){ navigator.share({text}).catch(()=>{}); }
  else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}

/* ---------- Sync en tiempo real con Supabase ---------- */
let supa=null, rtOn=false, pushTimer=null, syncing=false;
let dirty=new Set();
try{ dirty=new Set(JSON.parse(localStorage.getItem(KEY+'-dirty')||'[]')); }catch(e){}
function persistDirty(){ try{localStorage.setItem(KEY+'-dirty',JSON.stringify([...dirty]));}catch(e){} }
function markDirty(...keys){ keys.forEach(k=>dirty.add(k)); persistDirty(); pushSoon(); setPill(); }
function markAllDirty(){
  state.parts.forEach(p=>dirty.add('p_'+p.id));
  state.exps.forEach(e=>dirty.add('e_'+e.id));
  (state.plan||[]).forEach(i=>dirty.add('i_'+i.id));
  dirty.add('meta_rates'); dirty.add('meta_title');
  persistDirty(); pushSoon();
}
function syncTimeout(ms){ return new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms)); }
function rowFor(k){
  if(k==='meta_rates') return {id:k, kind:'meta', data:state.rates, up:state.rates.up||0};
  if(k==='meta_title') return {id:k, kind:'meta', data:{title:state.title}, up:state.titleUp||0};
  if(k.startsWith('p_')){ const p=state.parts.find(x=>'p_'+x.id===k); return p?{id:k,kind:'part',data:p,up:p.up||0}:null; }
  if(k.startsWith('e_')){ const e=state.exps.find(x=>'e_'+x.id===k); return e?{id:k,kind:'exp',data:e,up:e.up||0}:null; }
  if(k.startsWith('i_')){ const it=(state.plan||[]).find(x=>'i_'+x.id===k); return it?{id:k,kind:'meta',data:it,up:it.up||0}:null; }
  return null;
}
function mergeItem(row){
  if(!row||!row.id||!row.data) return false;
  if(row.kind==='part'){
    const p=row.data, cur=state.parts.find(x=>x.id===p.id);
    if(!cur){ state.parts.push(p); return true; }
    if((p.up||0)>(cur.up||0)){ Object.assign(cur,p); return true; }
    return false;
  }
  if(row.kind==='exp'){
    const e=row.data, cur=state.exps.find(x=>x.id===e.id);
    if(!cur){ state.exps.push(e); return true; }
    if((e.up||0)>(cur.up||0)){ Object.assign(cur,e); return true; }
    return false;
  }
  if(row.id.startsWith('i_')){
    if(!state.plan) state.plan=[];
    const it=row.data, cur=state.plan.find(x=>x.id===it.id);
    if(!cur){ state.plan.push(it); return true; }
    if((it.up||0)>(cur.up||0)){ Object.assign(cur,it); return true; }
    return false;
  }
  if(row.id==='meta_rates'){ if((row.up||0)>(state.rates.up||0)){ state.rates=row.data; return true; } return false; }
  if(row.id==='meta_title'){ if((row.up||0)>(state.titleUp||0)){ state.title=row.data.title||state.title; state.titleUp=row.up||0; return true; } return false; }
  return false;
}
function initSync(){
  if(supa || !SUPA.url || !SUPA.key || !window.supabase){ setPill(); return; }
  supa=window.supabase.createClient(SUPA.url, SUPA.key);
  fullSync();
  supa.channel('despedida-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:TABLE},pl=>{
      if(pl.new && mergeItem(pl.new)){ brideDedupe(); save(); render(); }
    })
    .subscribe(s=>{ rtOn=(s==='SUBSCRIBED'); setPill(); });
  window.addEventListener('online',()=>fullSync());
}
async function fullSync(manual){
  if(!supa){ if(manual)toast('Falta configurar la nube ⚙️ (o no cargó la librería)'); setPill(); return; }
  if(syncing) return;
  syncing=true; setPill();
  try{
    const {data,error}=await Promise.race([supa.from(TABLE).select('*'), syncTimeout(8000)]);
    if(error) throw error;
    let ch=false;
    (data||[]).forEach(r=>{ if(mergeItem(r)) ch=true; });
    if(ch){ brideDedupe(); save(); }
    syncing=false;
    await pushDirty();
    if(ch||manual) render();
    if(manual) toast('Sincronizado ✔ ☁️');
  }catch(e){
    syncing=false;
    if(manual) toast('No pude sincronizar 😕 ¿Hay internet?');
  }
  setPill();
}
async function pushDirty(){
  if(!supa || !dirty.size){ setPill(); return; }
  const keys=[...dirty];
  const rows=keys.map(rowFor).filter(Boolean);
  try{
    if(rows.length){
      const {error}=await Promise.race([supa.from(TABLE).upsert(rows), syncTimeout(8000)]);
      if(error) throw error;
    }
    keys.forEach(k=>dirty.delete(k)); persistDirty();
  }catch(e){ /* se reintenta en el próximo sync */ }
  setPill();
}
function pushSoon(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushDirty,700); }
function setPill(){
  const el=document.getElementById('syncPill');
  if(!el) return;
  if(!SUPA.url||!SUPA.key){ el.textContent='📴 solo local'; return; }
  if(syncing){ el.textContent='🔄 sincronizando…'; return; }
  if(dirty.size){ el.textContent='⬆️ por subir: '+dirty.size; return; }
  el.textContent = rtOn ? '🟢 en vivo' : '☁️ al día';
}
function syncNote(){
  if(!SUPA.url||!SUPA.key) return 'La nube todavía no está configurada: por ahora los datos viven solo en este celular. Los botones de plan B siguen funcionando.';
  return rtOn
    ? 'Están <b>en vivo</b> 🟢: lo que carga una les aparece a todas al instante. El botón es solo para forzar una actualización si algo se ve raro.'
    : 'Conectadas a la nube ☁️. Si algo no aparece, tocá sincronizar. Sin internet, todo se guarda en el celu y se sube solo al volver la señal.';
}

/* ---------- Página secreta de la novia (?novia) ---------- */
const NOVIA=/novia/.test(location.search+location.hash);
function renderNovia(){
  document.getElementById('main').style.display='none';
  document.querySelector('header').style.display='none';
  document.getElementById('nav').style.display='none';
  document.getElementById('fab').style.display='none';
  const hearts=['💍','💖','🌴','🥂','👰','✨','💃','🍹'].map((h,i)=>
    `<span class="heart" style="left:${8+i*12}%; font-size:${20+(i%3)*10}px; animation-duration:${7+(i%5)*2}s; animation-delay:${i*0.9}s">${h}</span>`).join('');
  const div=document.createElement('div');
  div.className='noviaPage';
  div.innerHTML=`${hearts}
    <div class="nv-msg">Río de Janeiro te espera 🌴</div>
    ${FOTO_LAU.startsWith('data:')?`<img class="nv-foto" src="${FOTO_LAU}" alt="">`:''}
    <div class="nv-title">LAU 💍</div>
    <div class="nv-msg" id="nvPre">Faltan</div>
    <div class="nv-days" id="nvDays">✨</div>
    <div class="nv-msg" id="nvPost">para tu despedida 💍</div>
    <div class="nv-clock" id="nvClock" style="display:none"></div>
    <div class="nv-sub">con amor, tus 7 favoritas 💖</div>`;
  document.body.appendChild(div);
  if(FECHA_VIAJE){ nvTick(); setInterval(nvTick,1000); }
  else document.getElementById('nvDays').textContent='🤫';
}
function nvTick(){
  const target=new Date(FECHA_VIAJE+'T00:00:00');
  const diff=target-new Date();
  const dEl=document.getElementById('nvDays'), pre=document.getElementById('nvPre'), post=document.getElementById('nvPost'), clk=document.getElementById('nvClock');
  if(diff<=0){
    pre.textContent='🎉';
    dEl.textContent='¡ES HOY!';
    dEl.style.fontSize='54px';
    post.textContent='A brillar, novia 🍾💍';
    clk.style.display='none';
    return;
  }
  const days=Math.floor(diff/86400000);
  const h=Math.floor(diff%86400000/3600000), m=Math.floor(diff%3600000/60000), s=Math.floor(diff%60000/1000);
  dEl.textContent=days;
  post.textContent=(days===1?'día':'días')+' para tu despedida 💍';
  clk.style.display='inline-block';
  clk.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ---------- Import por link (#d=...) ---------- */
function checkHash(){
  if(location.hash.startsWith('#d=')){
    const d=decodeData(decodeURIComponent(location.hash.slice(3)));
    history.replaceState(null,'',location.pathname+location.search);
    if(d && confirm('Te compartieron datos de gastos 💌 ¿Los combinamos con los tuyos?')){
      const added=mergeData(d); toast(added?('¡Listo! '+added+' gastos nuevos 🎉'):'Datos combinados ✔'); render();
    }
  }
}

load();
if(FOTO_LAU.startsWith('data:') && !NOVIA){
  const bg=document.getElementById('bgLau');
  bg.style.backgroundImage='url("'+FOTO_LAU+'")';
  bg.style.display='block';
}
if(NOVIA){
  renderNovia();
}else{
  render(); checkHash();
  if(window.supabase) initSync(); else setPill();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) fullSync(); });
}
window.initSync=NOVIA?function(){}:initSync;
</script>
